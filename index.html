<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#12122a" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Avioane" />
    <meta name="format-detection" content="telephone=no" />
    <meta
      name="description"
      content="Avioane — joc multiplayer pe grilă 10×10. Creează cont și joacă de pe telefon ca o aplicație."
    />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Avioane</title>
    <script>
      // Prevent theme flash before CSS/JS
      (function () {
        try {
          var t = localStorage.getItem('avioane_theme')
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          }
          document.documentElement.dataset.theme = t
          document.documentElement.style.colorScheme = t
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        min-height: 100dvh;
        overscroll-behavior: none;
      }
      html[data-theme='light'],
      html[data-theme='light'] body {
        background: #f6f1ea;
        color: #3a2e24;
      }
      html[data-theme='dark'],
      html:not([data-theme]) body,
      html[data-theme='dark'] body {
        background: #1c2438;
        color: #f7f3ee;
      }
      #app {
        min-height: 100dvh;
      }
    </style>
  </head>
  <body class="app-shell">
    <a class="skip-link" href="#main">Sari la conținut</a>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
